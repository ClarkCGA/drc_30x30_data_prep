[workspace]
name = "drc_30x30_data_prep"
authors = ["Clark CGA <cga@clarku.edu>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.2.0"

# ---------------------------------------------------------------------------
# Default environment: local geospatial processing (STAR pipeline).
# GDAL / PROJ / GEOS come from conda-forge so no system install is needed.
# ---------------------------------------------------------------------------
[dependencies]
python = "3.12.*"
gdal = ">=3.9"
geopandas = ">=1.0"
pyogrio = ">=0.10"
shapely = ">=2.0"
pyproj = ">=3.6"
rasterio = ">=1.4"
exactextract = ">=0.2"
numpy = ">=1.26"
pandas = ">=2.2"
pyarrow = ">=17"
openpyxl = ">=3.1"
pyyaml = ">=6.0"

[tasks]
star-iucn = "python -m star.run --config config/star_config.yaml iucn"
star-birdlife = "python -m star.run --config config/star_config.yaml birdlife"
star-combine = "python -m star.run --config config/star_config.yaml combine"
star-all = "python -m star.run --config config/star_config.yaml all"

# ---------------------------------------------------------------------------
# GEE environment: Earth Engine export (scripts/gee/) and authentication.
#   pixi run -e gee gee-lab      # Jupyter Lab; run authenticate.ipynb once
#   pixi run -e gee gee-export   # export all layers to Google Drive
#   pixi run -e gee gee-merge    # merge the downloaded CSVs
# ee.Initialize() uses the credentials and Cloud project chosen during the
# web sign-in in authenticate.ipynb (earthengine-api 1.x).
# ---------------------------------------------------------------------------
[feature.gee.dependencies]
earthengine-api = ">=1.5,<2"
jupyterlab = ">=4.4"

[feature.gee.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

[feature.gee.tasks]
gee-lab = "jupyter lab"
gee-export = "python scripts/gee/gee_export.py"
gee-merge = "python scripts/gee/merge_tables.py"

[environments]
default = { solve-group = "default" }
gee = { features = ["gee"], solve-group = "default" }
